# main 브랜치 push와 main 대상 PR에서 전체 테스트를 자동 실행
# 테스트는 src/test/resources/application.properties의 H2 메모리 DB를 사용하므로 MySQL, 환경 변수, 비밀 값이 필요 없음
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 코드를 읽기만 하면 되므로 최소 권한만 부여
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvnw는 Git에 실행 권한(100755)으로 기록되어 있어 별도 chmod 없이 실행
      - name: Run tests
        run: ./mvnw -B test

      # 실패 시 원인을 볼 수 있도록 테스트 리포트를 Artifact로 업로드
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
