spring.application.name=product-api

# MySQL 연결 (계정 정보는 환경 변수에서 읽음 - 비밀번호를 이 파일에 적지 말 것)
spring.datasource.url=jdbc:mysql://localhost:3306/product_api
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 테이블 구조는 Flyway(db/migration)만 바꾼다. Hibernate는 Entity와 테이블이 맞는지 검사만 함
spring.jpa.hibernate.ddl-auto=validate

# 기록 테이블(flyway_schema_history)이 없는 기존 DB를 자동으로 baseline 처리하지 않는다 (실수로 다른 DB에 적용되는 것 방지)
# 기존 MySQL을 처음 Flyway로 전환할 때만 SPRING_FLYWAY_BASELINE_ON_MIGRATE=true로 한 번 실행한다 → V1은 건너뛰고 V2부터 적용
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1

# AI 구현체 선택: stub(기본값, 실제 호출 없음) / gemini (환경 변수 AI_CLIENT로 바꿈)
ai.client=${AI_CLIENT:stub}

# Gemini 설정 (ai.client=gemini 일 때만 사용). API 키는 환경 변수로만 받는다 - 이 파일에 키를 적지 말 것
ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
ai.gemini.model=gemini-3.5-flash-lite
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.connect-timeout=5s
ai.gemini.read-timeout=20s
